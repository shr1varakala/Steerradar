name: Move files to root

on:
  workflow_dispatch:   # tap "Run workflow" from your phone

permissions:
  contents: write      # allows it to save changes back

jobs:
  move_files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move all files to root
        run: |
          shopt -s dotglob
          mv -f Steeradar/* .
          rm -rf Steeradar

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move files to root" || echo "No changes to commit"
          git push