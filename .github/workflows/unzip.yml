name: Unzip repo file

on:
  workflow_dispatch:   # tap "Run workflow" from your phone

permissions:
  contents: write      # needed to push back

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip preserving folders
        run: unzip -o your-file.zip -d .

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract your-file.zip" || echo "Nothing to commit"
          git push